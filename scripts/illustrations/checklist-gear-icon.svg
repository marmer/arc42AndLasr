<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== clipboard / sheet with folded corner ===== -->
    <g>
      <!-- sheet body, folded top-right corner -->
      <path d="M64,52 L182,52 L208,78 L208,250 L64,250 Z" fill="#E0F4EF"/>
      <!-- soft hatch shade down the left margin -->
      <path d="M64,52 L84,52 L84,250 L64,250 Z" fill="url(#hatch)" stroke="none"/>
      <!-- folded corner -->
      <path d="M182,52 L182,78 L208,78 Z" fill="#B6E5D9"/>
      <!-- teal accent border re-traced for weight -->
      <path d="M64,52 L182,52 L208,78 L208,250 L64,250 Z" stroke="#6CCBB2" stroke-width="3"/>

      <!-- ===== checklist rows: teal boxes, blue ticks, ink lines ===== -->
      <g stroke-width="2.2">
        <!-- row 1 (checked) -->
        <rect x="78" y="78" width="17" height="17" rx="3" fill="#ffffff" stroke="#6CCBB2"/>
        <path d="M81,87 L86,92 L94,80" stroke="#90C5E2"/>
        <path d="M104,82 L150,82 M104,90 L138,90"/>
        <!-- row 2 (checked) -->
        <rect x="78" y="106" width="17" height="17" rx="3" fill="#ffffff" stroke="#6CCBB2"/>
        <path d="M81,115 L86,120 L94,108" stroke="#90C5E2"/>
        <path d="M104,110 L150,110 M104,118 L132,118"/>
        <!-- row 3 (checked) -->
        <rect x="78" y="134" width="17" height="17" rx="3" fill="#ffffff" stroke="#6CCBB2"/>
        <path d="M81,143 L86,148 L94,136" stroke="#90C5E2"/>
        <path d="M104,138 L148,138 M104,146 L128,146"/>
        <!-- row 4 (checked) -->
        <rect x="78" y="162" width="17" height="17" rx="3" fill="#ffffff" stroke="#6CCBB2"/>
        <path d="M81,171 L86,176 L94,164" stroke="#90C5E2"/>
        <path d="M104,166 L146,166 M104,174 L134,174"/>
        <!-- row 5 (empty) -->
        <rect x="78" y="190" width="17" height="17" rx="3" fill="#ffffff" stroke="#6CCBB2"/>
        <path d="M104,194 L140,194 M104,202 L122,202"/>
      </g>
    </g>

    <!-- ===== small gear (upper-right, overlapping sheet edge) ===== -->
    <g id="gearSmall" transform="rotate(0 214 113)">
      <!-- squared teeth around a hub: 8 spokes -->
      <path d="M210,95 L218,95 L219,102 L225,99 L230,104 L227,110 L233,111 L233,119
               L227,120 L230,126 L225,131 L219,128 L218,135 L210,135 L209,128 L203,131
               L198,126 L201,120 L195,119 L195,111 L201,110 L198,104 L203,99 L209,102 Z"
            fill="#6CCBB2" stroke="#1b1b1b" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="214" cy="115" r="7" fill="#E0F4EF" stroke="#1b1b1b" stroke-width="2.4"/>
      <animateTransform attributeName="transform" type="rotate"
        values="0 214 115;3 214 115;0 214 115" dur="6s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </g>

    <!-- ===== large gear (lower-right, overlapping sheet) ===== -->
    <g id="gearLarge" transform="rotate(0 208 188)">
      <!-- squared teeth around a hub: 8 spokes -->
      <path d="M201,152 L215,152 L217,162 L227,157 L236,166 L231,176 L241,178 L241,192
               L231,194 L236,204 L227,213 L217,208 L215,218 L201,218 L199,208 L189,213
               L180,204 L185,194 L175,192 L175,178 L185,176 L180,166 L189,157 L199,162 Z"
            fill="#B6E5D9" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="208" cy="185" r="13" fill="#6CCBB2" stroke="#1b1b1b" stroke-width="2.6"/>
      <circle cx="208" cy="185" r="5.5" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.2"/>
      <animateTransform attributeName="transform" type="rotate"
        values="0 208 185;-3 208 185;0 208 185" dur="6s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </g>
  </g>

  <animateTransform xlink:href="#artwork" attributeName="transform" type="translate"
    values="0,0;0,1.2;0,0" dur="5.5s" repeatCount="indefinite"
    calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
</svg>
