<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== single sheet of paper, folded top-right corner ===== -->
    <!-- body of the sheet: top edge stops short at the folded corner -->
    <path d="M86,58 L184,58 L214,88 L214,242 Q214,250 206,250 L86,250 Q78,250 78,242 L78,66 Q78,58 86,58 Z"
          fill="#E0F4EF"/>
    <!-- folded corner -->
    <path d="M184,58 L184,88 L214,88 Z" fill="#B6E5D9"/>
    <path d="M184,58 L214,88"/>
    <!-- subtle hatch shade down the right inner edge -->
    <path d="M198,96 L206,96 Q210,96 210,104 L210,238 Q210,246 202,246 L198,246 Z"
          fill="url(#hatch)" stroke="none"/>

    <!-- ===== document content as short ink strokes (NOT letters) ===== -->
    <g stroke-width="2.2">
      <!-- teal accent header line -->
      <path d="M96,112 L150,112" stroke="#6CCBB2" stroke-width="4"/>
      <path d="M96,132 L172,132"/>
      <path d="M96,148 L160,148"/>
      <path d="M96,176 L172,176"/>
      <path d="M96,192 L150,192"/>
      <path d="M96,218 L168,218"/>
    </g>

    <!-- ===== magnifying glass inspecting the sheet ===== -->
    <g id="glass">
      <!-- lens : translucent blue tint -->
      <circle cx="176" cy="142" r="44" fill="#90C5E2" fill-opacity="0.45"/>
      <circle cx="176" cy="142" r="44"/>
      <!-- inner rim -->
      <circle cx="176" cy="142" r="36" stroke-width="2.2"/>
      <!-- glint highlight -->
      <path d="M158,124 Q166,116 178,118" stroke="#ffffff" stroke-width="3"/>
      <!-- enlarged content lines seen through the lens -->
      <g stroke-width="2.4" stroke="#1b1b1b">
        <path d="M158,138 L196,138"/>
        <path d="M158,150 L188,150"/>
      </g>
      <!-- handle -->
      <path d="M207,173 L238,204" stroke-width="7"/>
      <path d="M207,173 L238,204" stroke="#B6E5D9" stroke-width="3"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0;1.2,-1.2;0,0" dur="5s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </g>
  </g>
</svg>
