<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- speed / motion lines (left, behind runner) -->
    <g stroke="#90C5E2" stroke-width="2.6" opacity="0.85">
      <path d="M34,118 L92,118"/>
      <path d="M28,138 L84,138"/>
      <path d="M40,158 L78,158"/>
    </g>

    <!-- runner leaning forward, mid-stride, moving right -->
    <g id="runner">

      <!-- back leg : extended back, pushing off the ground (toe behind) -->
      <path d="M150,182 Q162,210 184,224 L208,234"/>
      <path d="M208,234 L222,230"/>
      <!-- front leg : knee driven high & forward, lower leg tucked -->
      <path d="M146,180 Q126,196 132,218 L150,234"/>
      <path d="M150,234 L164,238"/>

      <!-- torso : strong forward lean, teal shirt -->
      <path d="M120,138 Q142,118 162,134 L152,186 Q146,192 140,184 Z" fill="#6CCBB2"/>
      <!-- sparse hatch shading on the lower/back side of torso -->
      <path d="M146,160 L152,186 Q146,192 140,184 L142,160 Z" fill="url(#hatch)" stroke="none"/>

      <!-- back arm : swung back & down, blue accent cuff -->
      <path d="M132,140 Q116,150 110,166"/>
      <path d="M110,166 L106,180" stroke="#90C5E2" stroke-width="3"/>
      <!-- front arm : driving up & forward, bent elbow, blue cuff -->
      <path d="M156,136 Q176,132 184,116"/>
      <path d="M184,116 L192,104" stroke="#90C5E2" stroke-width="3"/>

      <!-- head : round doodle head, leaning forward into the run -->
      <circle cx="156" cy="106" r="16" fill="#ffffff"/>
      <!-- face : dot eyes + tiny focused mouth, tilted forward (small details 2.2) -->
      <g stroke-width="2.2">
        <path d="M158,102 Q161,106 164,102"/>
        <path d="M167,100 Q170,104 173,100"/>
        <path d="M163,113 Q168,115 172,112"/>
      </g>
    </g>

    <animateTransform xlink:href="#runner" attributeName="transform" type="rotate"
      values="-1.4 150 150;1.4 150 150;-1.4 150 150" dur="4.6s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </g>

  <animateTransform xlink:href="#artwork" attributeName="transform" type="translate"
    values="0,0;0,1.3;0,0" dur="5.5s" repeatCount="indefinite"
    calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
</svg>
