<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork : a feather / quill, diagonal (tip upper-right, quill lower-left) -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- vane outline (teal), pointed tip at upper-right, fanning toward lower-left -->
    <path d="M226,64
             Q262,84 250,128
             Q236,178 184,220
             Q156,242 124,254
             Q138,212 152,170
             Q174,112 226,64 Z"
          fill="#6CCBB2"/>

    <!-- light tint accent along the upper-right edge (lit side) -->
    <path d="M226,64 Q262,84 250,128 Q243,156 224,186
             Q210,140 200,112 Q210,86 226,64 Z"
          fill="#E0F4EF" stroke="none"/>

    <!-- sparse hatch shading on the lower-left (shaded) side -->
    <path d="M152,170 Q138,212 124,254 Q156,242 184,220
             Q166,200 160,180 Q154,172 152,170 Z"
          fill="url(#hatch)" stroke="none"/>

    <!-- central ink rachis (shaft) running through the vane and down to the quill -->
    <path d="M226,66 Q196,112 178,158 Q160,206 144,250 Q132,274 116,280"/>

    <!-- barbs : light teal/blue lines fanning off the rachis (thin) -->
    <g stroke-width="2.2">
      <!-- upper-right / lit side barbs (blue) -->
      <path d="M212,96 Q228,88 240,96" stroke="#90C5E2"/>
      <path d="M201,124 Q220,116 234,124" stroke="#90C5E2"/>
      <path d="M190,152 Q210,146 226,156" stroke="#90C5E2"/>
      <path d="M178,182 Q198,178 214,190" stroke="#90C5E2"/>
      <path d="M165,212 Q184,210 200,222" stroke="#90C5E2"/>
      <!-- lower-left / shaded side barbs (light tint) -->
      <path d="M209,100 Q194,94 182,102" stroke="#B6E5D9"/>
      <path d="M197,128 Q180,122 167,132" stroke="#B6E5D9"/>
      <path d="M186,156 Q167,152 153,164" stroke="#B6E5D9"/>
      <path d="M174,186 Q154,184 140,198" stroke="#B6E5D9"/>
      <path d="M161,216 Q142,216 129,230" stroke="#B6E5D9"/>
    </g>
  </g>

  <!-- subtle idle float: tiny slow sway of the whole feather -->
  <animateTransform xlink:href="#artwork" attributeName="transform" type="rotate"
    values="-1 178 160;1.3 178 160;-1 178 160" dur="6.5s" repeatCount="indefinite"
    calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
</svg>
