<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- bench -->
    <path d="M70,232 L230,232"/>
    <path d="M82,232 L82,256 M218,232 L218,256"/>
    <rect x="70" y="214" width="160" height="18" rx="7" fill="#E0F4EF"/>

    <!-- figure A : yawning -->
    <g>
      <path d="M98,214 L102,168 Q120,154 138,168 L142,214 Z" fill="#90C5E2"/>
      <path d="M123,162 Q138,158 138,168 L142,214 L125,214 Z" fill="url(#hatch)" stroke="none"/>
      <path d="M114,168 L114,158 M126,168 L126,158"/>
      <circle cx="120" cy="138" r="16" fill="#ffffff"/>
      <g stroke-width="2.2">
        <path d="M112,134 Q115,138 118,134 M122,134 Q125,138 128,134"/>
      </g>
      <ellipse id="yawn" cx="120" cy="148" rx="5" ry="6" fill="#1b1b1b"/>
      <path d="M102,188 Q90,176 94,162"/>
      <path d="M140,190 L146,200"/>
      <animate xlink:href="#yawn" attributeName="ry" values="6;9;6" dur="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </g>

    <!-- figure B : asleep, head leaning -->
    <g id="sleeper" transform="rotate(9 190 150)">
      <path d="M168,214 L172,168 Q190,154 208,168 L212,214 Z" fill="#6CCBB2"/>
      <path d="M193,162 Q208,158 208,168 L212,214 L195,214 Z" fill="url(#hatch)" stroke="none"/>
      <path d="M184,168 L184,158 M196,168 L196,158"/>
      <circle cx="190" cy="140" r="16" fill="#ffffff"/>
      <g stroke-width="2.2">
        <path d="M182,140 Q185,144 188,140 M192,140 Q195,144 198,140"/>
        <path d="M184,150 Q190,153 196,150"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" values="9 190 150;11 190 150;9 190 150" dur="4.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </g>

    <!-- Zzz -->
    <g id="zzz" stroke="#90C5E2" stroke-width="2.4" opacity="0.9">
      <path d="M210,116 l9,0 -9,9 9,0"/>
      <path d="M224,98 l7,0 -7,7 7,0"/>
      <animateTransform attributeName="transform" type="translate" values="0,4;0,-6;0,4" dur="3.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <animateTransform xlink:href="#artwork" attributeName="transform" type="translate" values="0,0;0,1.4;0,0" dur="5.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
</svg>
