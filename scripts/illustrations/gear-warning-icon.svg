<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- gear (slow back-and-forth rotation) -->
    <g id="gear" transform="rotate(0 150 139)">
      <!-- cog body: 8 distinct teeth around a round hub -->
      <path d="M138,54 L138,40 L162,40 L162,54
               L186,64 L196,52 L213,69 L203,79
               L213,103 L227,103 L227,127 L213,127
               L213,151 L227,151 L227,175 L213,175
               L203,199 L213,209 L196,226 L186,214
               L162,224 L162,238 L138,238 L138,224
               L114,214 L104,226 L87,209 L97,199
               L87,175 L73,175 L73,151 L87,151
               L87,127 L73,127 L73,103 L87,103
               L97,79 L87,69 L104,52 L114,64 Z"
            fill="#6CCBB2"/>
      <!-- sparse hatch on shaded lower-right of cog -->
      <path d="M213,151 L227,151 L227,175 L213,175 L203,199 L213,209 L196,226 L186,214 L162,224 L162,238 L138,238 L150,139 Z"
            fill="url(#hatch)" stroke="none"/>
      <!-- central round opening -->
      <circle cx="150" cy="139" r="52" fill="#ffffff"/>
    </g>

    <!-- warning triangle inside the gear -->
    <g id="warn">
      <path d="M150,100 Q156,100 159,106 L186,160 Q189,168 180,168 L120,168 Q111,168 114,160 L141,106 Q144,100 150,100 Z"
            fill="#90C5E2"/>
      <!-- exclamation mark -->
      <path d="M150,120 L150,143" stroke-width="4.2"/>
      <circle cx="150" cy="155" r="2.4" fill="#1b1b1b" stroke="none"/>
    </g>

    <!-- subtle gear wobble -->
    <animateTransform xlink:href="#gear" attributeName="transform" type="rotate"
      values="-3 150 148;3 150 148;-3 150 148" dur="6.5s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </g>

  <!-- whole-artwork bob -->
  <animateTransform xlink:href="#artwork" attributeName="transform" type="translate"
    values="0,0;0,1.4;0,0" dur="5.5s" repeatCount="indefinite"
    calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
</svg>
