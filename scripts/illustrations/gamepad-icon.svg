<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- antenna / round top button -->
    <path d="M150,118 L150,96"/>
    <circle cx="150" cy="84" r="13" fill="#90C5E2"/>
    <circle cx="146" cy="80" r="3.2" fill="#ffffff" stroke="none"/>

    <!-- controller body : two grips + central deck -->
    <path d="M99,124
             Q150,114 201,124
             Q236,132 240,168
             Q244,206 224,212
             Q208,216 198,196
             Q192,184 150,184
             Q108,184 102,196
             Q92,216 76,212
             Q56,206 60,168
             Q64,132 99,124 Z"
          fill="#6CCBB2"/>

    <!-- shaded underside -->
    <path d="M150,184 Q192,184 198,196 Q208,216 224,212 Q244,206 240,168 Q239,178 232,188 Q220,204 200,202 Q190,201 184,192 Q176,184 150,184 Z"
          fill="url(#hatch)" stroke="none"/>

    <!-- d-pad (plus) on the left -->
    <path d="M93,158 L113,158 M103,148 L103,168" stroke="#90C5E2" stroke-width="9"/>
    <path d="M93,158 L113,158 M103,148 L103,168" stroke-width="2.4"/>

    <!-- action buttons on the right -->
    <circle cx="195" cy="150" r="8.5" fill="#90C5E2"/>
    <circle cx="214" cy="166" r="7.5" fill="#B6E5D9"/>
    <circle cx="176" cy="166" r="7.5" fill="#B6E5D9"/>
    <circle cx="195" cy="182" r="6.5" fill="#E0F4EF"/>
  </g>

  <animateTransform xlink:href="#artwork" attributeName="transform" type="translate" values="0,0;0,1.4;0,0" dur="5.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
</svg>
