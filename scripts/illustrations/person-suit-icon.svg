<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- head -->
    <circle cx="150" cy="76" r="16" fill="#ffffff"/>
    <g stroke-width="2.2">
      <path d="M144,75 L145,76 M155,75 L156,76"/>
      <path d="M146,84 Q150,86 154,84"/>
    </g>

    <!-- neck -->
    <path d="M144,92 L144,106 M156,92 L156,106"/>

    <!-- blazer body (teal), broad shoulders -->
    <path d="M104,250 L108,158 Q110,120 150,118 Q190,120 192,158 L196,250 Z" fill="#6CCBB2"/>

    <!-- shaded side (sparse hatch) -->
    <path d="M150,118 Q190,120 192,158 L196,250 L156,250 L156,128 Z" fill="url(#hatch)" stroke="none"/>

    <!-- shirt V / lapels (lighter tint) -->
    <path d="M150,118 L132,150 L150,182 L168,150 Z" fill="#E0F4EF"/>
    <path d="M132,128 L132,150 L150,182 M168,128 L168,150 L150,182"/>

    <!-- tie -->
    <path d="M150,128 L145,140 L150,172 L155,140 Z" fill="#90C5E2"/>
    <path d="M146,130 L154,130"/>

    <!-- center seam below tie -->
    <path d="M150,182 L150,250"/>

    <!-- arm seams -->
    <path d="M120,172 L114,250 M180,172 L186,250"/>

    <!-- shoulder collar lines -->
    <path d="M132,128 Q140,120 150,118 M168,128 Q160,120 150,118"/>

    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,1.3;0,0" dur="5.2s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </g>
</svg>
