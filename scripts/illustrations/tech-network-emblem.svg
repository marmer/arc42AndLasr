<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== badge frame : double ring with notched studs (emblem framing) ===== -->
    <circle cx="150" cy="148" r="118" fill="#ffffff"/>
    <circle cx="150" cy="148" r="118"/>
    <circle cx="150" cy="148" r="106" stroke-width="2.2"/>
    <!-- ring studs around the badge edge -->
    <circle cx="150" cy="36" r="5" fill="#6CCBB2"/>
    <circle cx="229" cy="69" r="5" fill="#90C5E2"/>
    <circle cx="262" cy="148" r="5" fill="#6CCBB2"/>
    <circle cx="229" cy="227" r="5" fill="#90C5E2"/>
    <circle cx="150" cy="260" r="5" fill="#6CCBB2"/>
    <circle cx="71" cy="227" r="5" fill="#90C5E2"/>
    <circle cx="38" cy="148" r="5" fill="#6CCBB2"/>
    <circle cx="71" cy="69" r="5" fill="#90C5E2"/>

    <!-- ===== inner emblem field : split tinted disc ===== -->
    <circle cx="150" cy="148" r="92" fill="#E0F4EF"/>
    <path d="M150,56 a92,92 0 0 1 0,184 Z" fill="#B6E5D9"/>
    <circle cx="150" cy="148" r="92"/>

    <!-- ===== globe : stylized meridians + equator (network/globe motif) ===== -->
    <circle cx="150" cy="148" r="60" fill="#ffffff"/>
    <circle cx="150" cy="148" r="60"/>
    <!-- equator + tropic lines -->
    <path d="M91,148 L209,148" stroke-width="2.2"/>
    <path d="M97,121 Q150,131 203,121" stroke-width="2.2"/>
    <path d="M97,175 Q150,165 203,175" stroke-width="2.2"/>
    <!-- meridians -->
    <path d="M150,88 Q108,148 150,208" stroke-width="2.2"/>
    <path d="M150,88 Q192,148 150,208" stroke-width="2.2"/>
    <path d="M150,88 L150,208" stroke-width="2.2"/>

    <!-- ===== connection nodes riding the globe (network) ===== -->
    <path d="M150,103 L121,142 M121,142 L176,134 M176,134 L150,178 M150,178 L116,164 M176,134 L188,160"/>
    <circle id="g1" cx="150" cy="103" r="8" fill="#6CCBB2"/>
    <circle id="g2" cx="121" cy="142" r="8" fill="#90C5E2"/>
    <circle id="g3" cx="176" cy="134" r="8" fill="#6CCBB2"/>
    <circle id="g4" cx="150" cy="178" r="7" fill="#90C5E2"/>
    <circle cx="116" cy="164" r="5.5" fill="#6CCBB2"/>
    <circle cx="188" cy="160" r="5.5" fill="#90C5E2"/>

    <!-- node pulses -->
    <animate xlink:href="#g1" attributeName="opacity" values="1;0.55;1" dur="4.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate xlink:href="#g3" attributeName="opacity" values="0.6;1;0.6" dur="4.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate xlink:href="#g2" attributeName="opacity" values="1;0.6;1" dur="5.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </g>

  <animateTransform xlink:href="#artwork" attributeName="transform" type="translate" values="0,0;0,1.3;0,0" dur="5.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
</svg>
