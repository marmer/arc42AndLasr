<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== gear top-left (12-tooth, behind lock) ===== -->
    <g id="gearTL" transform="rotate(0 96 96)">
      <path d="M96,64 L100,64 L102,73 L110,75 L116,68 L119,71 L113,79 L118,86 L127,84 L128,88
               L120,92 L121,101 L130,103 L129,107 L120,108 L118,116 L124,123 L121,126 L114,120
               L106,124 L106,133 L102,133 L100,124 L92,124 L88,132 L84,130 L86,121 L79,116
               L70,120 L69,116 L77,110 L73,103 L64,104 L64,100 L73,97 L72,88 L63,87 L65,83
               L74,84 L77,76 L71,69 L75,67 L82,73 L90,69 L92,60 Z"
            fill="#90C5E2"/>
      <circle cx="96" cy="96" r="11" fill="#ffffff"/>
      <circle cx="96" cy="96" r="4.5" fill="#90C5E2" stroke-width="2.2"/>
      <animateTransform attributeName="transform" type="rotate" values="0 96 96;3 96 96;0 96 96"
                        dur="6s" repeatCount="indefinite" calcMode="spline"
                        keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </g>

    <!-- ===== gear bottom-left (10-tooth) ===== -->
    <g id="gearBL" transform="rotate(0 84 198)">
      <path d="M84,172 L87,172 L89,180 L97,181 L102,175 L105,178 L100,185 L105,191 L113,189 L114,193
               L106,196 L107,205 L114,208 L112,212 L104,211 L101,219 L106,225 L103,228 L96,223
               L89,227 L88,235 L85,235 L83,227 L75,228 L71,235 L68,233 L71,225 L64,221 L57,225
               L55,222 L61,216 L57,209 L49,210 L49,206 L57,203 L56,195 L48,193 L49,189 L57,190
               L60,182 L55,176 L59,174 L65,179 L73,176 L75,168 Z"
            fill="#6CCBB2"/>
      <circle cx="84" cy="198" r="10" fill="#ffffff"/>
      <circle cx="84" cy="198" r="4" fill="#6CCBB2" stroke-width="2.2"/>
      <animateTransform attributeName="transform" type="rotate" values="0 84 198;-3 84 198;0 84 198"
                        dur="6.6s" repeatCount="indefinite" calcMode="spline"
                        keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </g>

    <!-- ===== gear right (12-tooth) ===== -->
    <g id="gearR" transform="rotate(0 220 160)">
      <path d="M220,128 L224,128 L226,137 L234,139 L240,132 L243,135 L237,143 L242,150 L251,148 L252,152
               L244,156 L245,165 L254,167 L253,171 L244,172 L242,180 L248,187 L245,190 L238,184
               L230,188 L230,197 L226,197 L224,188 L216,188 L212,196 L208,194 L210,185 L203,180
               L194,184 L193,180 L201,174 L197,167 L188,168 L188,164 L197,161 L196,152 L187,151
               L189,147 L198,148 L201,140 L195,133 L199,131 L206,137 L214,133 L216,124 Z"
            fill="#90C5E2"/>
      <circle cx="220" cy="160" r="11" fill="#ffffff"/>
      <circle cx="220" cy="160" r="4.5" fill="#90C5E2" stroke-width="2.2"/>
      <animateTransform attributeName="transform" type="rotate" values="0 220 160;-3 220 160;0 220 160"
                        dur="7.2s" repeatCount="indefinite" calcMode="spline"
                        keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </g>

    <!-- ===== padlock (centre, on top) ===== -->
    <!-- shackle -->
    <path d="M132,152 L132,128 Q132,104 156,104 Q180,104 180,128 L180,152" stroke-width="3.4"/>
    <!-- body -->
    <rect x="116" y="150" width="80" height="66" rx="11" fill="#E0F4EF"/>
    <!-- hatch shade on right of body -->
    <path d="M178,150 L196,150 Q196,150 196,161 L196,205 Q196,216 185,216 L178,216 Z"
          fill="url(#hatch)" stroke="none"/>
    <!-- keyhole -->
    <circle cx="156" cy="176" r="7" fill="#1b1b1b" stroke="none"/>
    <path d="M156,180 L151,198 L161,198 Z" fill="#1b1b1b" stroke="none"/>

  </g>

  <animateTransform xlink:href="#artwork" attributeName="transform" type="translate"
                    values="0,0;0,1.4;0,0" dur="5.5s" repeatCount="indefinite" calcMode="spline"
                    keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
</svg>
