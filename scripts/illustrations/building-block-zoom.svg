<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== stacked assembly of building-block cubes (lower-left) ===== -->
    <!-- each cube: front face (tint), top face (light tint), right face (teal/blue) -->

    <!-- bottom-left cube : teal -->
    <g>
      <!-- top -->
      <path d="M70,206 L96,192 L122,206 L96,220 Z" fill="#B6E5D9"/>
      <!-- right -->
      <path d="M96,220 L122,206 L122,236 L96,250 Z" fill="#6CCBB2"/>
      <path d="M96,220 L122,206 L122,236 L96,250 Z" fill="url(#hatch)" stroke="none"/>
      <!-- front -->
      <path d="M70,206 L96,220 L96,250 L70,236 Z" fill="#E0F4EF"/>
    </g>

    <!-- bottom-right cube : blue -->
    <g>
      <path d="M122,206 L148,192 L174,206 L148,220 Z" fill="#90C5E2"/>
      <path d="M148,220 L174,206 L174,236 L148,250 Z" fill="#90C5E2"/>
      <path d="M148,220 L174,206 L174,236 L148,250 Z" fill="url(#hatch)" stroke="none"/>
      <path d="M122,206 L148,220 L148,250 L122,236 Z" fill="#E0F4EF"/>
    </g>

    <!-- top cube (stacked on the bridge between the two) : teal -->
    <g>
      <path d="M96,178 L122,164 L148,178 L122,192 Z" fill="#B6E5D9"/>
      <path d="M122,192 L148,178 L148,208 L122,222 Z" fill="#6CCBB2"/>
      <path d="M122,192 L148,178 L148,208 L122,222 Z" fill="url(#hatch)" stroke="none"/>
      <path d="M96,178 L122,192 L122,222 L96,208 Z" fill="#E0F4EF"/>
    </g>

    <!-- ===== pulled-out / magnified block (upper-right "zoom") ===== -->
    <!-- dotted lead lines from assembly to the zoomed block -->
    <g stroke-width="2.2" stroke-dasharray="2 7" opacity="0.8">
      <path d="M152,172 L188,150"/>
      <path d="M158,194 L190,178"/>
    </g>

    <!-- magnifier ring around the zoomed cube -->
    <g id="zoom">
      <circle cx="222" cy="138" r="44" fill="#ffffff" stroke-width="3"/>
      <!-- the enlarged single cube inside the lens -->
      <path d="M198,138 L222,124 L246,138 L222,152 Z" fill="#B6E5D9"/>
      <path d="M222,152 L246,138 L246,166 L222,180 Z" fill="#6CCBB2"/>
      <path d="M222,152 L246,138 L246,166 L222,180 Z" fill="url(#hatch)" stroke="none"/>
      <path d="M198,138 L222,152 L222,180 L198,166 Z" fill="#E0F4EF"/>
      <!-- inner detail dots on the magnified front face -->
      <g stroke-width="2.2">
        <path d="M205,150 L213,154"/>
        <path d="M205,160 L213,164"/>
      </g>
      <!-- magnifier handle -->
      <path d="M256,170 L274,190" stroke-width="6"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0;0,-1.4;0,0" dur="5.2s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </g>

  </g>

  <animateTransform xlink:href="#artwork" attributeName="transform" type="translate" values="0,0;0,1.4;0,0" dur="5.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
</svg>
