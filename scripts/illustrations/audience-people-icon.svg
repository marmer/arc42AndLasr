<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- ground line -->
    <path d="M44,236 L256,236"/>

    <!-- ===== BACK ROW (two figures, slightly smaller, set behind) ===== -->

    <!-- figure C : back-left, blue -->
    <g>
      <path d="M76,212 L80,172 Q94,160 108,172 L112,212 Z" fill="#90C5E2"/>
      <path d="M97,166 Q108,162 108,172 L112,212 L98,212 Z" fill="url(#hatch)" stroke="none"/>
      <circle cx="94" cy="146" r="14" fill="#ffffff"/>
      <g stroke-width="2.2">
        <circle cx="89" cy="145" r="1.4" fill="#1b1b1b" stroke="none"/>
        <circle cx="99" cy="145" r="1.4" fill="#1b1b1b" stroke="none"/>
        <path d="M90,153 Q94,155 98,153"/>
      </g>
    </g>

    <!-- figure D : back-right, teal tint -->
    <g>
      <path d="M192,212 L196,172 Q210,160 224,172 L228,212 Z" fill="#B6E5D9"/>
      <path d="M213,166 Q224,162 224,172 L228,212 L214,212 Z" fill="url(#hatch)" stroke="none"/>
      <circle cx="210" cy="146" r="14" fill="#ffffff"/>
      <g stroke-width="2.2">
        <circle cx="205" cy="145" r="1.4" fill="#1b1b1b" stroke="none"/>
        <circle cx="215" cy="145" r="1.4" fill="#1b1b1b" stroke="none"/>
        <path d="M206,153 Q210,155 214,153"/>
      </g>
    </g>

    <!-- ===== FRONT ROW (two figures, full pilot size r=16) ===== -->

    <!-- figure A : front-left, teal -->
    <g>
      <path d="M118,236 L122,184 Q140,170 158,184 L162,236 Z" fill="#6CCBB2"/>
      <path d="M143,178 Q158,174 158,184 L162,236 L145,236 Z" fill="url(#hatch)" stroke="none"/>
      <path d="M134,184 L134,174 M146,184 L146,174"/>
      <circle cx="140" cy="154" r="16" fill="#ffffff"/>
      <g stroke-width="2.2">
        <circle cx="134" cy="153" r="1.6" fill="#1b1b1b" stroke="none"/>
        <circle cx="146" cy="153" r="1.6" fill="#1b1b1b" stroke="none"/>
        <path d="M134,162 Q140,165 146,162"/>
      </g>
      <!-- attentive raised arm (hand up) -->
      <path d="M124,200 Q113,182 124,164"/>
      <path d="M160,206 L166,216"/>
    </g>

    <!-- figure B : front-right, blue -->
    <g>
      <path d="M150,236 L154,184 Q172,170 190,184 L194,236 Z" fill="#90C5E2"/>
      <path d="M175,178 Q190,174 190,184 L194,236 L177,236 Z" fill="url(#hatch)" stroke="none"/>
      <path d="M166,184 L166,174 M178,184 L178,174"/>
      <circle cx="172" cy="154" r="16" fill="#ffffff"/>
      <g stroke-width="2.2">
        <circle cx="166" cy="153" r="1.6" fill="#1b1b1b" stroke="none"/>
        <circle cx="178" cy="153" r="1.6" fill="#1b1b1b" stroke="none"/>
        <path d="M166,162 Q172,165 178,162"/>
      </g>
      <path d="M156,206 L150,216"/>
      <path d="M192,206 L198,216"/>
    </g>

  </g>

  <animateTransform xlink:href="#artwork" attributeName="transform" type="translate" values="0,0;0,1.4;0,0" dur="5.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
</svg>
