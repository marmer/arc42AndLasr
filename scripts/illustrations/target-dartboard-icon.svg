<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- concentric target rings (centre ~143,155) -->
    <circle cx="143" cy="155" r="84" fill="#6CCBB2"/>
    <circle cx="143" cy="155" r="66" fill="#ffffff"/>
    <circle cx="143" cy="155" r="48" fill="#6CCBB2"/>
    <circle cx="143" cy="155" r="30" fill="#E0F4EF"/>
    <!-- bullseye -->
    <circle cx="143" cy="155" r="14" fill="#90C5E2"/>

    <!-- sparse hatch shadow on lower-left of the board -->
    <path d="M143,239 A84,84 0 0,1 64,182 A84,84 0 0,0 143,239 Z" fill="url(#hatch)" stroke="none"/>

    <!-- dart hitting the bullseye, coming from upper-right -->
    <!-- shaft, tip lodged at the bullseye centre -->
    <path d="M143,155 L236,62" stroke="#1b1b1b"/>
    <!-- arrowhead barbs near the tip -->
    <path d="M150,166 L143,155 L161,150" stroke="#1b1b1b" stroke-width="2.6" fill="none"/>
    <!-- flight / fletching at the tail -->
    <g id="flight">
      <path d="M236,62 L214,58 L226,74 Z" fill="#6CCBB2"/>
      <path d="M236,62 L222,82 L238,80 Z" fill="#90C5E2"/>
      <path d="M236,62 L252,46 L256,60 Z" fill="#B6E5D9"/>
    </g>
  </g>

  <!-- subtle idle: whole artwork gentle bob (<=1.5px) -->
  <animateTransform xlink:href="#artwork" attributeName="transform" type="translate"
    values="0,0;0,1.4;0,0" dur="5.2s" repeatCount="indefinite"
    calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
</svg>
