<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- ===== shared style kit (keep identical across all motifs) ===== -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b1b1b" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1b1b1b" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- torn-paper sticker -->
  <g filter="url(#shadow)">
    <path d="M22,30 Q16,16 34,17 L256,13 Q288,12 286,36 L289,250 Q291,272 268,271 L42,274 Q20,276 19,253 Z"
          fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4" stroke-opacity="0.18" filter="url(#rough)"/>
  </g>

  <!-- artwork -->
  <g id="artwork" filter="url(#rough)" fill="none" stroke="#1b1b1b" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- ground line -->
    <path d="M70,254 L230,254"/>

    <!-- base: foot slab -->
    <path d="M86,254 L86,240 Q86,235 91,235 L209,235 Q214,235 214,240 L214,254 Z" fill="#90C5E2"/>
    <!-- base: collar -->
    <path d="M101,235 L101,224 Q101,219 106,219 L194,219 Q199,219 199,224 L199,235 Z" fill="#B6E5D9"/>
    <!-- base hatch on shaded right -->
    <path d="M178,219 L199,219 L199,235 L214,235 L214,254 L196,254 Z" fill="url(#hatch)" stroke="none"/>

    <!-- knight: neck + horse-head profile facing left -->
    <path d="M120,219
             Q112,198 114,176
             Q116,150 132,132
             Q120,128 110,134
             Q104,124 116,116
             Q132,108 144,98
             Q148,84 150,74
             Q158,82 160,98
             Q174,104 184,122
             Q194,142 190,168
             Q186,194 182,219 Z"
          fill="#6CCBB2"/>

    <!-- shaded back of the neck (right) -->
    <path d="M190,168 Q186,194 182,219 L166,219 Q174,194 178,168 Q182,144 174,124 Q170,114 162,108 Q176,108 184,122 Q194,142 190,168 Z"
          fill="url(#hatch)" stroke="none"/>

    <!-- ear: pointed triangle, top-back of head -->
    <path d="M150,74 L156,52 Q159,46 164,54 L170,72 Q163,80 160,98 Z" fill="#E0F4EF"/>

    <!-- muzzle / lower jaw projecting forward-left -->
    <path d="M110,134 Q98,140 96,152 Q95,162 104,166 Q116,166 124,158 L132,132 Q120,128 110,134 Z" fill="#E0F4EF"/>

    <!-- mane: ridge running down the back of the head/neck (blue accent) -->
    <g stroke-width="2.2">
      <path d="M150,74 Q166,92 174,120 Q182,150 178,182" stroke="#90C5E2"/>
      <path d="M156,84 L166,84 M160,104 L172,106 M163,128 L176,130 M164,154 L176,154 M162,180 L173,180"
            stroke="#90C5E2"/>
    </g>

    <!-- eye -->
    <circle cx="138" cy="120" r="4" fill="#1b1b1b" stroke="none"/>

    <!-- nostril + mouth detail on the muzzle -->
    <g stroke-width="2.2">
      <path d="M104,150 Q108,153 112,150"/>
      <path d="M100,160 Q112,164 122,160"/>
    </g>
  </g>

  <animateTransform xlink:href="#artwork" attributeName="transform" type="translate" values="0,0;0,1.3;0,0" dur="5.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
</svg>
