<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="arrows expanding outward">
  <style>
    .out { fill: none; stroke: #1B1B1B; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
    .lim { fill: none; stroke: #6CCBB2; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .ink { stroke: #1B1B1B; stroke-width: 4; } .t { fill: #6CCBB2; }
    .grow { transform-box: view-box; transform-origin: 50px 50px; animation: grow 3s ease-in-out infinite; }
    @keyframes grow { 0%, 100% { transform: scale(.94); } 50% { transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { .grow { animation: none; } }
  </style>
  <g class="grow">
    <path class="out" d="M50 50 L82 18 M82 18 L82 31 M82 18 L69 18 M50 50 L18 18 M18 18 L18 31 M18 18 L31 18 M50 50 L18 82 M18 82 L18 69 M18 82 L31 82 M50 50 L82 82 M82 82 L82 69 M82 82 L69 82"/>
    <path class="lim" d="M50 50 L82 18 M82 18 L82 31 M82 18 L69 18 M50 50 L18 18 M18 18 L18 31 M18 18 L31 18 M50 50 L18 82 M18 82 L18 69 M18 82 L31 82 M50 50 L82 82 M82 82 L82 69 M82 82 L69 82"/>
    <circle class="t ink" cx="50" cy="50" r="6"/>
  </g>
</svg>
