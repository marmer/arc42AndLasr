<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 100" role="img" aria-label="Schach-Springer">
  <style>
    .ck-s1 { animation: ck-blink 5s ease-in-out infinite; }
    .ck-s2 { animation: ck-blink 5s ease-in-out 1.6s infinite; }
    .ck-s3 { animation: ck-blink 5s ease-in-out 3.2s infinite; }
    @keyframes ck-blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ck-s1, .ck-s2, .ck-s3 { animation: none; opacity: 1; } }
  </style>
  <!-- sparks -->
  <g stroke="#1B1B1B" stroke-width="2.6" stroke-linecap="round">
    <line class="ck-s1" x1="12" y1="14" x2="17" y2="19"/>
    <line class="ck-s2" x1="34" y1="6" x2="34" y2="12.5"/>
    <line class="ck-s3" x1="56" y1="14" x2="51" y2="19"/>
  </g>
  <!-- knight -->
  <path d="M27 78
           C27 69 27.5 63 25.5 57
           C23 51 19.5 48.5 16.5 45.5
           Q14.5 44 16 42.5
           L23 41.5
           Q24.5 41 24 39.5
           L12 38
           Q8.5 36.5 9.5 33.5
           Q10.5 30.5 14 28.5
           L24 22.5
           L29.5 12
           L34.5 18.5
           L41.5 12.5
           Q50 17.5 53.5 27
           Q57 38 54.5 50
           Q52.5 60 51 66
           Q50 71 50 78 Z"
        fill="#6CCBB2" stroke="#1B1B1B" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- mane -->
  <path d="M44.5 21 Q48.5 27 49 34.5 M47.5 33 Q50 41 48.5 50" fill="none"
        stroke="#1B1B1B" stroke-width="2.2" stroke-linecap="round"/>
  <!-- nostril + eye -->
  <circle cx="13.5" cy="34" r="1.3" fill="#1B1B1B"/>
  <circle cx="27.5" cy="26.5" r="2.3" fill="#1B1B1B"/>
  <!-- base -->
  <g stroke="#1B1B1B" stroke-width="3.2" stroke-linejoin="round">
    <rect x="18" y="78" width="40" height="8.5" rx="3" fill="#B2E4D7"/>
    <rect x="12" y="86.5" width="52" height="10" rx="3.5" fill="#B2E4D7"/>
  </g>
</svg>
