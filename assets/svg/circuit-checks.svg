      0% { transform: scale(0.4); opacity: 0.6; }
      65% { transform: scale(1); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .cc-pulse { animation: none; opacity: 0; } }
  </style>
