<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Zentraler Knoten mit Leiterbahnen">
  <style>
    .cn-pulse { animation: cn-pulse 6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes cn-pulse {
      0% { transform: scale(0.4); opacity: 0.65; }
      65% { transform: scale(1); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .cn-pulse { animation: none; opacity: 0; } }
  </style>
  <g stroke="#1B1B1B" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
