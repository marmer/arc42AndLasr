      <rect x="60.7" y="53.5" width="5" height="6" rx="1.6" transform="rotate(45 63.2 45)"/>
      <rect x="69.2" y="42.5" width="6" height="5" rx="1.6" transform="rotate(45 63.2 45)"/>
      <rect x="52.2" y="42.5" width="6" height="5" rx="1.6" transform="rotate(45 63.2 45)"/>
    </g>
    <circle cx="63.2" cy="45" r="9.5" fill="#B2E4D7"/>
    <circle cx="63.2" cy="45" r="4" fill="#FFFFFF"/>
  </g>
  <!-- document center -->
