<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 92" role="img" aria-label="That's it folks – konzentrische Ringe">
  <style>
    .tf-rings { animation: tf-pulse 8s ease-in-out infinite; transform-origin: 50px 47px; }
    @keyframes tf-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    .tf-text {
      font-family: 'DM Sans', 'Karla', sans-serif;
      font-weight: 700;
      paint-order: stroke fill;
    }
    @media (prefers-reduced-motion: reduce) { .tf-rings { animation: none; } }
  </style>
  <g class="tf-rings" stroke="#1B1B1B" stroke-width="2.8">
    <circle cx="50" cy="47" r="42.5" fill="#3390C3"/>
    <circle cx="50" cy="47" r="34" fill="#90C5E2"/>
    <circle cx="50" cy="47" r="25.5" fill="#B2E4D7"/>
    <circle cx="50" cy="47" r="17" fill="#90C5E2"/>
    <circle cx="50" cy="47" r="8.5" fill="#1B1B1B"/>
  </g>
  <text class="tf-text" x="50" y="51.5" text-anchor="middle" font-size="13"
        textLength="93" lengthAdjust="spacingAndGlyphs"
        fill="#FFFFFF" stroke="#1B1B1B" stroke-width="1.1">THAT&#8217;S IT FOLKS</text>
</svg>
