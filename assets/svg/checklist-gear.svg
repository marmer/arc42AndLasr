<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Checkliste mit Zahnrad">
  <style>
    .cg-gear { animation: cg-spin 32s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes cg-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .cg-gear { animation: none; } }
  </style>
  <!-- document -->
  <g stroke="#1B1B1B" stroke-width="3.2" stroke-linejoin="round">
    <path d="M26 14 h30 l10 10 v62 h-40 z" fill="#FFFFFF"/>
    <path d="M56 14 l10 10 h-10 z" fill="#B2E4D7"/>
  </g>
  <!-- checklist rows -->
  <g stroke="#1B1B1B" stroke-width="2.4" stroke-linejoin="round">
    <rect x="31.5" y="31" width="7.5" height="7.5" rx="1.8" fill="#FFFFFF"/>
    <rect x="31.5" y="44" width="7.5" height="7.5" rx="1.8" fill="#FFFFFF"/>
    <rect x="31.5" y="57" width="7.5" height="7.5" rx="1.8" fill="#FFFFFF"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M33 34.5 l1.8 1.9 l3.6 -3.9" stroke="#35977D" stroke-width="2.4"/>
    <path d="M33 47.5 l1.8 1.9 l3.6 -3.9" stroke="#35977D" stroke-width="2.4"/>
    <path d="M33 60.5 l1.8 1.9 l3.6 -3.9" stroke="#F4AD0E" stroke-width="2.6"/>
  </g>
  <g stroke="#1B1B1B" stroke-width="2.4" stroke-linecap="round">
    <line x1="43.5" y1="34.5" x2="60" y2="34.5"/>
    <line x1="43.5" y1="47.5" x2="60" y2="47.5"/>
    <line x1="43.5" y1="60.5" x2="55" y2="60.5"/>
  </g>
  <!-- gear bottom-right -->
  <g class="cg-gear" stroke="#1B1B1B" stroke-width="2.8" stroke-linejoin="round">
    <g fill="#6CCBB2">
      <rect x="63.7" y="52.5" width="6.6" height="8" rx="2"/>
      <rect x="63.7" y="77.5" width="6.6" height="8" rx="2"/>
      <rect x="50.5" y="65.7" width="8" height="6.6" rx="2"/>
      <rect x="75.5" y="65.7" width="8" height="6.6" rx="2"/>
      <rect x="63.7" y="52.5" width="6.6" height="8" rx="2" transform="rotate(45 67 69)"/>
      <rect x="63.7" y="77.5" width="6.6" height="8" rx="2" transform="rotate(45 67 69)"/>
      <rect x="50.5" y="65.7" width="8" height="6.6" rx="2" transform="rotate(45 67 69)"/>
      <rect x="75.5" y="65.7" width="8" height="6.6" rx="2" transform="rotate(45 67 69)"/>
    </g>
    <circle cx="67" cy="69" r="11.5" fill="#6CCBB2"/>
    <circle cx="67" cy="69" r="4.8" fill="#FFFFFF"/>
  </g>
</svg>
