<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Zielscheibe mit Pfeil im Zentrum">
  <style>
    .td-ripple { animation: td-ripple 5s ease-out infinite; transform-origin: 48px 52px; }
    @keyframes td-ripple {
      0% { transform: scale(0.15); opacity: 0.7; }
      70% { transform: scale(1.0); opacity: 0; }
      100% { transform: scale(1.0); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .td-ripple { animation: none; opacity: 0; } }
  </style>
  <g stroke="#1B1B1B" stroke-width="3.5">
    <circle cx="48" cy="52" r="40" fill="#B2E4D7"/>
    <circle cx="48" cy="52" r="30" fill="#FFFFFF"/>
    <circle cx="48" cy="52" r="20" fill="#6CCBB2"/>
    <circle cx="48" cy="52" r="10" fill="#FFFFFF"/>
    <circle cx="48" cy="52" r="4.5" fill="#F4AD0E" stroke-width="3"/>
  </g>
  <circle class="td-ripple" cx="48" cy="52" r="40" fill="none" stroke="#35977D" stroke-width="2.5"/>
  <g stroke="#1B1B1B" stroke-linecap="round" stroke-linejoin="round">
    <line x1="86" y1="10" x2="56" y2="44" stroke-width="4"/>
    <path d="M51.5 49.5 L59.5 46.9 L53.4 41.5 Z" fill="#1B1B1B" stroke-width="3"/>
    <line x1="81.5" y1="6.5" x2="89" y2="13.2" stroke-width="4"/>
    <line x1="77" y1="11.5" x2="84.5" y2="18.2" stroke-width="4"/>
  </g>
</svg>
