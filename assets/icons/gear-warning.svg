<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="ico ico-warn" role="img" aria-label="Warnung">
  <style>
    .ico-warn{color:#1B1B1B}
    .ico-warn .ln{fill:none;stroke:currentColor;stroke-width:var(--sw,4);
      stroke-linecap:round;stroke-linejoin:round}
    .ico-warn .tri{fill:#fff;stroke:#E0A23C}
    .ico-warn .amber{stroke:#E0A23C}
    .ico-warn .dot{fill:#E0A23C;stroke:none}
    .ico-warn .blink{animation:wBlink 1.8s ease-in-out infinite;
      transform-box:fill-box;transform-origin:center}
    @keyframes wBlink{0%,100%{opacity:1}50%{opacity:.5}}
    @media (prefers-reduced-motion: reduce){.ico-warn .blink{animation:none}}
  </style>
  <!-- cog, slow continuous rotation (SMIL keeps the centre exact) -->
  <g>
    <g class="ln">
      <path d="M 36.00,26.06 L 37.08,19.20 L 42.92,19.20 L 44.00,26.06 L 47.03,27.32 L 52.64,23.23 L 56.77,27.36 L 52.68,32.97 L 53.94,36.00 L 60.80,37.08 L 60.80,42.92 L 53.94,44.00 L 52.68,47.03 L 56.77,52.64 L 52.64,56.77 L 47.03,52.68 L 44.00,53.94 L 42.92,60.80 L 37.08,60.80 L 36.00,53.94 L 32.97,52.68 L 27.36,56.77 L 23.23,52.64 L 27.32,47.03 L 26.06,44.00 L 19.20,42.92 L 19.20,37.08 L 26.06,36.00 L 27.32,32.97 L 23.23,27.36 L 27.36,23.23 L 32.97,27.32 Z"/>
      <circle cx="40" cy="40" r="7.5"/>
    </g>
    <animateTransform attributeName="transform" type="rotate"
        from="0 40 40" to="360 40 40" dur="18s" repeatCount="indefinite"/>
  </g>
  <!-- warning badge, gently blinking -->
  <g class="blink">
    <path class="ln tri" d="M70,50 L90,86 L50,86 Z"/>
    <path class="ln amber" d="M70,64 V73"/>
    <circle class="dot" cx="70" cy="80" r="2.4"/>
  </g>
</svg>
