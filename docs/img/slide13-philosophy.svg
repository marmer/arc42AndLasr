<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 190">
  <!-- base / stand -->
  <rect x="95" y="162" width="30" height="7" rx="3.5" fill="#1B1B1B"/>
  <rect x="82" y="168" width="56" height="8" rx="4" fill="#1B1B1B"/>

  <!-- vertical pole -->
  <rect x="108" y="90" width="4" height="75" rx="2" fill="#1B1B1B"/>

  <!-- horizontal beam -->
  <rect x="56" y="86" width="108" height="7" rx="3.5" fill="#1B1B1B"/>

  <!-- pivot circle -->
  <circle cx="110" cy="89" r="7" fill="#6CCBB2"/>
  <circle cx="110" cy="89" r="3" fill="white"/>

  <!-- LEFT pan suspension string -->
  <line x1="62" y1="93" x2="54" y2="122" stroke="#1B1B1B" stroke-width="1.5"/>
  <line x1="62" y1="93" x2="74" y2="122" stroke="#1B1B1B" stroke-width="1.5"/>

  <!-- RIGHT pan suspension string (slightly tilted — scales not in perfect balance) -->
  <line x1="158" y1="93" x2="148" y2="115" stroke="#1B1B1B" stroke-width="1.5"/>
  <line x1="158" y1="93" x2="168" y2="115" stroke="#1B1B1B" stroke-width="1.5"/>

  <!-- LEFT pan (lower) -->
  <path d="M44,122 Q64,136 84,122" fill="#f0faf8" stroke="#6CCBB2" stroke-width="2"/>

  <!-- RIGHT pan (higher) -->
  <path d="M138,115 Q158,129 178,115" fill="#f0faf8" stroke="#6CCBB2" stroke-width="2"/>

  <!-- question mark on left pan — "a question worth weighing" -->
  <text x="64" y="134" font-family="DM Sans,Helvetica Neue,sans-serif" font-size="14" font-weight="700" fill="#6CCBB2" text-anchor="middle">?</text>

  <!-- small dots on right pan — "principles" -->
  <circle cx="152" cy="122" r="3" fill="#6CCBB2"/>
  <circle cx="158" cy="124" r="3" fill="#1B1B1B" opacity="0.4"/>
  <circle cx="164" cy="122" r="3" fill="#6CCBB2"/>
</svg>
