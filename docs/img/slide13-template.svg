<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 190">
  <!-- drop shadow -->
  <rect x="24" y="14" width="154" height="162" rx="7" fill="rgba(0,0,0,0.10)"/>
  <!-- page body -->
  <rect x="20" y="10" width="154" height="162" rx="7" fill="white" stroke="#e0e0e0" stroke-width="1.2"/>
  <!-- header bar -->
  <rect x="20" y="10" width="154" height="30" rx="7" fill="#1B1B1B"/>
  <rect x="20" y="28" width="154" height="12" fill="#1B1B1B"/>
  <!-- header label -->
  <text x="97" y="29" font-family="DM Sans,Helvetica Neue,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">arc42</text>
  <!-- teal underline in header -->
  <rect x="74" y="31" width="46" height="3" rx="1.5" fill="#6CCBB2"/>

  <!-- 12 chapter boxes — 3 cols × 4 rows -->
  <!-- col x: 28 | 78 | 128   width: 42 -->
  <!-- row y: 46 | 78 | 110 | 142   height: 24 -->

  <!-- Row 1 -->
  <rect x="28" y="46" width="42" height="24" rx="3" fill="#f0faf8" stroke="#6CCBB2" stroke-width="1.4"/>
  <rect x="78" y="46" width="42" height="24" rx="3" fill="#f0faf8" stroke="#6CCBB2" stroke-width="1.4"/>
  <rect x="128" y="46" width="42" height="24" rx="3" fill="#f0faf8" stroke="#6CCBB2" stroke-width="1.4"/>
  <text x="49" y="63" font-family="DM Sans,sans-serif" font-size="11" font-weight="700" fill="#6CCBB2" text-anchor="middle">1</text>
  <text x="99" y="63" font-family="DM Sans,sans-serif" font-size="11" font-weight="700" fill="#6CCBB2" text-anchor="middle">2</text>
  <text x="149" y="63" font-family="DM Sans,sans-serif" font-size="11" font-weight="700" fill="#6CCBB2" text-anchor="middle">3</text>

  <!-- Row 2 -->
  <rect x="28" y="78" width="42" height="24" rx="3" fill="#f0faf8" stroke="#6CCBB2" stroke-width="1.4"/>
  <rect x="78" y="78" width="42" height="24" rx="3" fill="#f0faf8" stroke="#6CCBB2" stroke-width="1.4"/>
  <rect x="128" y="78" width="42" height="24" rx="3" fill="#f0faf8" stroke="#6CCBB2" stroke-width="1.4"/>
  <text x="49" y="95" font-family="DM Sans,sans-serif" font-size="11" font-weight="700" fill="#6CCBB2" text-anchor="middle">4</text>
  <text x="99" y="95" font-family="DM Sans,sans-serif" font-size="11" font-weight="700" fill="#6CCBB2" text-anchor="middle">5</text>
  <text x="149" y="95" font-family="DM Sans,sans-serif" font-size="11" font-weight="700" fill="#6CCBB2" text-anchor="middle">6</text>

  <!-- Row 3 -->
  <rect x="28" y="110" width="42" height="24" rx="3" fill="#f0faf8" stroke="#6CCBB2" stroke-width="1.4"/>
  <rect x="78" y="110" width="42" height="24" rx="3" fill="#f0faf8" stroke="#6CCBB2" stroke-width="1.4"/>
  <rect x="128" y="110" width="42" height="24" rx="3" fill="#f0faf8" stroke="#6CCBB2" stroke-width="1.4"/>
  <text x="49" y="127" font-family="DM Sans,sans-serif" font-size="11" font-weight="700" fill="#6CCBB2" text-anchor="middle">7</text>
  <text x="99" y="127" font-family="DM Sans,sans-serif" font-size="11" font-weight="700" fill="#6CCBB2" text-anchor="middle">8</text>
  <text x="149" y="127" font-family="DM Sans,sans-serif" font-size="11" font-weight="700" fill="#6CCBB2" text-anchor="middle">9</text>

  <!-- Row 4 -->
  <rect x="28" y="142" width="42" height="24" rx="3" fill="#f0faf8" stroke="#6CCBB2" stroke-width="1.4"/>
  <rect x="78" y="142" width="42" height="24" rx="3" fill="#f0faf8" stroke="#6CCBB2" stroke-width="1.4"/>
  <rect x="128" y="142" width="42" height="24" rx="3" fill="#f0faf8" stroke="#6CCBB2" stroke-width="1.4"/>
  <text x="49" y="159" font-family="DM Sans,sans-serif" font-size="10" font-weight="700" fill="#6CCBB2" text-anchor="middle">10</text>
  <text x="99" y="159" font-family="DM Sans,sans-serif" font-size="10" font-weight="700" fill="#6CCBB2" text-anchor="middle">11</text>
  <text x="149" y="159" font-family="DM Sans,sans-serif" font-size="10" font-weight="700" fill="#6CCBB2" text-anchor="middle">12</text>
</svg>
