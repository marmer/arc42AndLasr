<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 190">
  <!-- drop shadow -->
  <rect x="24" y="14" width="154" height="162" rx="7" fill="rgba(0,0,0,0.10)"/>
  <!-- page body -->
  <rect x="20" y="10" width="154" height="162" rx="7" fill="white" stroke="#e0e0e0" stroke-width="1.2"/>
  <!-- header bar — plain teal, no arc42 branding -->
  <rect x="20" y="10" width="154" height="28" rx="7" fill="#6CCBB2"/>
  <rect x="20" y="28" width="154" height="10" fill="#6CCBB2"/>

  <!-- [Title] placeholder in header -->
  <rect x="52" y="18" width="88" height="12" rx="3" fill="rgba(255,255,255,0.30)" stroke="rgba(255,255,255,0.6)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="96" y="28" font-family="DM Sans,Helvetica Neue,sans-serif" font-size="9" fill="white" opacity="0.85" text-anchor="middle">[ Title ]</text>

  <!-- Section 1 -->
  <rect x="28" y="46" width="136" height="28" rx="4" fill="#f9f9f9" stroke="#ccc" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="36" y="57" font-family="DM Sans,sans-serif" font-size="8" fill="#aaa">[ § 1 ]</text>
  <rect x="36" y="61" width="80" height="4" rx="2" fill="#ddd"/>
  <rect x="36" y="67" width="55" height="3" rx="1.5" fill="#e8e8e8"/>

  <!-- Section 2 -->
  <rect x="28" y="80" width="136" height="28" rx="4" fill="#f9f9f9" stroke="#ccc" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="36" y="91" font-family="DM Sans,sans-serif" font-size="8" fill="#aaa">[ § 2 ]</text>
  <rect x="36" y="95" width="90" height="4" rx="2" fill="#ddd"/>
  <rect x="36" y="101" width="62" height="3" rx="1.5" fill="#e8e8e8"/>

  <!-- Section 3 — two columns -->
  <rect x="28" y="114" width="65" height="28" rx="4" fill="#f9f9f9" stroke="#ccc" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="36" y="125" font-family="DM Sans,sans-serif" font-size="8" fill="#aaa">[ § 3 ]</text>
  <rect x="36" y="129" width="40" height="4" rx="2" fill="#ddd"/>

  <rect x="99" y="114" width="65" height="28" rx="4" fill="#f9f9f9" stroke="#ccc" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="107" y="125" font-family="DM Sans,sans-serif" font-size="8" fill="#aaa">[ § 4 ]</text>
  <rect x="107" y="129" width="44" height="4" rx="2" fill="#ddd"/>

  <!-- Section 4 — full width footer -->
  <rect x="28" y="148" width="136" height="18" rx="4" fill="#f0faf8" stroke="#6CCBB2" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="96" y="161" font-family="DM Sans,sans-serif" font-size="8" fill="#6CCBB2" opacity="0.7" text-anchor="middle">[ § 5 ]</text>
</svg>
