<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="checklist with a gear">
  <style>
    .ink { stroke: #1B1B1B; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .t { fill: #6CCBB2; } .lt { fill: #E0F4EF; } .wt { fill: #FFFFFF; }
    .check { fill: none; stroke: #6CCBB2; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .gear { transform-box: view-box; transform-origin: 72px 71px; animation: spin 12s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .gear { animation: none; } }
  </style>
  <rect class="lt ink" x="18" y="14" width="48" height="68" rx="6"/>
  <rect class="t ink" x="35" y="9" width="14" height="9" rx="2.5"/>
  <g>
    <rect class="wt ink" x="26" y="30" width="9" height="9" rx="1.5"/>
    <path class="check" d="M28 34.5 l2 2 l3.5 -3.5"/>
    <rect class="t" x="40" y="32" width="18" height="4" rx="2"/>
  </g>
  <g>
    <rect class="wt ink" x="26" y="46" width="9" height="9" rx="1.5"/>
    <path class="check" d="M28 50.5 l2 2 l3.5 -3.5"/>
    <rect class="t" x="40" y="48" width="18" height="4" rx="2"/>
  </g>
  <g>
    <rect class="wt ink" x="26" y="62" width="9" height="9" rx="1.5"/>
    <rect class="t" x="40" y="64" width="14" height="4" rx="2"/>
  </g>
  <!-- gear -->
  <g class="gear">
    <g>
      <rect class="t ink" x="69" y="55" width="6" height="8" rx="1.2"/>
      <rect class="t ink" x="69" y="55" width="6" height="8" rx="1.2" transform="rotate(60 72 71)"/>
      <rect class="t ink" x="69" y="55" width="6" height="8" rx="1.2" transform="rotate(120 72 71)"/>
      <rect class="t ink" x="69" y="55" width="6" height="8" rx="1.2" transform="rotate(180 72 71)"/>
      <rect class="t ink" x="69" y="55" width="6" height="8" rx="1.2" transform="rotate(240 72 71)"/>
      <rect class="t ink" x="69" y="55" width="6" height="8" rx="1.2" transform="rotate(300 72 71)"/>
    </g>
    <circle class="t ink" cx="72" cy="71" r="12"/>
    <circle class="lt ink" cx="72" cy="71" r="5"/>
  </g>
</svg>
