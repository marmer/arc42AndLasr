<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="gear with a padlock">
  <style>
    .ink { stroke: #1B1B1B; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .t { fill: #6CCBB2; } .lt { fill: #E0F4EF; } .wt { fill: #FFFFFF; }
    .gear1 { transform-box: view-box; transform-origin: 44px 50px; animation: spin 16s linear infinite; }
    .gear2 { transform-box: view-box; transform-origin: 80px 26px; animation: spin 9s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .gear1, .gear2 { animation: none; } }
  </style>
  <!-- small gear -->
  <g class="gear2">
    <g>
      <rect class="t ink" x="77" y="9"  width="6" height="8" rx="1.2"/>
      <rect class="t ink" x="77" y="9"  width="6" height="8" rx="1.2" transform="rotate(60 80 26)"/>
      <rect class="t ink" x="77" y="9"  width="6" height="8" rx="1.2" transform="rotate(120 80 26)"/>
      <rect class="t ink" x="77" y="9"  width="6" height="8" rx="1.2" transform="rotate(180 80 26)"/>
      <rect class="t ink" x="77" y="9"  width="6" height="8" rx="1.2" transform="rotate(240 80 26)"/>
      <rect class="t ink" x="77" y="9"  width="6" height="8" rx="1.2" transform="rotate(300 80 26)"/>
    </g>
    <circle class="t ink" cx="80" cy="26" r="11"/>
    <circle class="lt ink" cx="80" cy="26" r="4.5"/>
  </g>
  <!-- big gear -->
  <g class="gear1">
    <g>
      <rect class="t ink" x="39" y="6" width="10" height="13" rx="2"/>
      <rect class="t ink" x="39" y="6" width="10" height="13" rx="2" transform="rotate(45 44 50)"/>
      <rect class="t ink" x="39" y="6" width="10" height="13" rx="2" transform="rotate(90 44 50)"/>
      <rect class="t ink" x="39" y="6" width="10" height="13" rx="2" transform="rotate(135 44 50)"/>
      <rect class="t ink" x="39" y="6" width="10" height="13" rx="2" transform="rotate(180 44 50)"/>
      <rect class="t ink" x="39" y="6" width="10" height="13" rx="2" transform="rotate(225 44 50)"/>
      <rect class="t ink" x="39" y="6" width="10" height="13" rx="2" transform="rotate(270 44 50)"/>
      <rect class="t ink" x="39" y="6" width="10" height="13" rx="2" transform="rotate(315 44 50)"/>
    </g>
    <circle class="t ink" cx="44" cy="50" r="30"/>
    <circle class="lt ink" cx="44" cy="50" r="22"/>
  </g>
  <!-- padlock -->
  <path class="ink" style="fill:none" d="M37 48 v-5 a7 7 0 0 1 14 0 v5"/>
  <rect class="t ink" x="33" y="48" width="22" height="18" rx="3"/>
  <circle class="wt" cx="44" cy="55" r="2.6"/>
  <rect class="wt" x="42.8" y="55" width="2.4" height="6" rx="1.2"/>
</svg>
