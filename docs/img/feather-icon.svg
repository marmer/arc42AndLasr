<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="quill feather">
  <style>
    .ink { stroke: #1B1B1B; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .t { fill: #6CCBB2; } .lt { fill: #E0F4EF; }
    .barb { fill: none; stroke: #1B1B1B; stroke-width: 2.4; stroke-linecap: round; }
    .sway { transform-box: view-box; transform-origin: 26px 82px; animation: sway 5s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
    @media (prefers-reduced-motion: reduce) { .sway { animation: none; } }
  </style>
