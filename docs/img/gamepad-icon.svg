<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="game controller">
  <style>
    .ink { stroke: #1B1B1B; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .body { fill: #6CCBB2; }
    .dpad { fill: #1B1B1B; }
    .sel { fill: #1B1B1B; }
    .btn { fill: #FFFFFF; stroke: #1B1B1B; stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: press 2.6s ease-in-out infinite; }
    .b2 { animation-delay: .5s; }
    @keyframes press { 0%, 72%, 100% { fill: #FFFFFF; transform: scale(1); } 84% { fill: #6CCBB2; transform: scale(.78); } }
    @media (prefers-reduced-motion: reduce) { .btn { animation: none; } }
  </style>
  <rect class="body ink" x="13" y="38" width="74" height="28" rx="6"/>
  <path class="dpad" d="M26 51 h4.5 v-4.5 a2 2 0 0 1 2 -2 a2 2 0 0 1 2 2 v4.5 h4.5 a2 2 0 0 1 2 2 a2 2 0 0 1 -2 2 h-4.5 v4.5 a2 2 0 0 1 -2 2 a2 2 0 0 1 -2 -2 v-4.5 h-4.5 a2 2 0 0 1 -2 -2 a2 2 0 0 1 2 -2 Z"/>
  <rect class="sel" x="45" y="55" width="4" height="2.6" rx="1.3"/>
  <rect class="sel" x="51" y="55" width="4" height="2.6" rx="1.3"/>
  <circle class="btn b1" cx="64" cy="52" r="4"/>
  <circle class="btn b2" cx="75" cy="52" r="4"/>
</svg>
