<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 190">
  <!-- back card (slightly offset, rotated) -->
  <g transform="rotate(4, 110, 95)">
    <rect x="38" y="18" width="138" height="170" rx="6" fill="#ddd"/>
  </g>

  <!-- main card -->
  <g transform="rotate(-2, 110, 95)">
    <!-- card body -->
    <rect x="34" y="14" width="138" height="170" rx="6" fill="white" stroke="#d0d0d0" stroke-width="1.2"/>

    <!-- teal header bar -->
    <rect x="34" y="14" width="138" height="32" rx="6" fill="#6CCBB2"/>
    <rect x="34" y="34" width="138" height="12" fill="#6CCBB2"/>
    <!-- "Quick Ref" label -->
    <text x="103" y="34" font-family="DM Sans,Helvetica Neue,sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">Quick Reference</text>

    <!-- corner fold -->
    <polygon points="148,14 172,14 172,38" fill="#4aab93"/>

    <!-- Section rows -->
    <!-- Row 1 -->
    <rect x="44" y="56" width="16" height="16" rx="3" fill="#6CCBB2"/>
    <text x="52" y="68" font-family="DM Sans,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">1</text>
    <rect x="68" y="59" width="72" height="5" rx="2.5" fill="#1B1B1B" opacity="0.75"/>
    <rect x="68" y="67" width="52" height="3.5" rx="1.75" fill="#ccc"/>

    <!-- Row 2 -->
    <rect x="44" y="82" width="16" height="16" rx="3" fill="#6CCBB2"/>
    <text x="52" y="94" font-family="DM Sans,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">2</text>
    <rect x="68" y="85" width="66" height="5" rx="2.5" fill="#1B1B1B" opacity="0.75"/>
    <rect x="68" y="93" width="46" height="3.5" rx="1.75" fill="#ccc"/>

    <!-- Row 3 -->
    <rect x="44" y="108" width="16" height="16" rx="3" fill="#6CCBB2"/>
    <text x="52" y="120" font-family="DM Sans,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">3</text>
    <rect x="68" y="111" width="76" height="5" rx="2.5" fill="#1B1B1B" opacity="0.75"/>
    <rect x="68" y="119" width="56" height="3.5" rx="1.75" fill="#ccc"/>

    <!-- divider line -->
    <rect x="44" y="134" width="112" height="1.5" rx="0.75" fill="#6CCBB2" opacity="0.4"/>

    <!-- Condensed lines (dense quick-ref area) -->
    <rect x="44" y="142" width="88" height="3.5" rx="1.75" fill="#bbb"/>
    <rect x="44" y="150" width="68" height="3.5" rx="1.75" fill="#bbb"/>
    <rect x="44" y="158" width="78" height="3.5" rx="1.75" fill="#bbb"/>
    <rect x="44" y="166" width="58" height="3.5" rx="1.75" fill="#bbb"/>

    <!-- branding -->
    <text x="160" y="178" font-family="DM Sans,sans-serif" font-size="9" font-weight="700" fill="#6CCBB2" text-anchor="end">arc42</text>
  </g>
</svg>
