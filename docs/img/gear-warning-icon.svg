<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="process warning">
  <style>
    .ink { stroke: #1B1B1B; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .t { fill: #6CCBB2; } .lt { fill: #E0F4EF; } .wt { fill: #FFFFFF; }
    .gear { transform-box: view-box; transform-origin: 50px 50px; animation: spin 18s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .gear { animation: none; } }
  </style>
  <g class="gear">
    <g>
      <rect class="t ink" x="44" y="5" width="12" height="16" rx="2.5"/>
      <rect class="t ink" x="44" y="5" width="12" height="16" rx="2.5" transform="rotate(45 50 50)"/>
      <rect class="t ink" x="44" y="5" width="12" height="16" rx="2.5" transform="rotate(90 50 50)"/>
      <rect class="t ink" x="44" y="5" width="12" height="16" rx="2.5" transform="rotate(135 50 50)"/>
      <rect class="t ink" x="44" y="5" width="12" height="16" rx="2.5" transform="rotate(180 50 50)"/>
      <rect class="t ink" x="44" y="5" width="12" height="16" rx="2.5" transform="rotate(225 50 50)"/>
      <rect class="t ink" x="44" y="5" width="12" height="16" rx="2.5" transform="rotate(270 50 50)"/>
      <rect class="t ink" x="44" y="5" width="12" height="16" rx="2.5" transform="rotate(315 50 50)"/>
    </g>
    <circle class="t ink" cx="50" cy="50" r="34"/>
    <circle class="lt ink" cx="50" cy="50" r="25"/>
  </g>
  <path class="wt ink" d="M50 30 L72 70 a4 4 0 0 1 -3.5 6 H31.5 a4 4 0 0 1 -3.5 -6 Z"/>
  <rect class="t" x="47.5" y="44" width="5" height="16" rx="2.5"/>
  <circle class="t" cx="50" cy="67" r="2.8"/>
</svg>
